name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, type-check, test, and verify package (React 19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:types
      - run: npm test
      - run: npm run lint:pack
      - run: npm run check:pack

  test-react-18:
    name: Test against React 18
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install
      - name: Swap React 19 for React 18
        run: npm install --no-save react@18.3.1 react-dom@18.3.1 @types/react@18.3.12
      - run: npm test
